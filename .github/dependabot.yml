version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CodeQL init and analyze must move together or the analysis fails.
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /custom_components/dashboard_editor/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript majors change the build; they are taken deliberately, not by bot.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
