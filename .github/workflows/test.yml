# Lint, type check, the pytest suite, and the frontend bundle drift check;
# release.yml calls this workflow so the same jobs gate every release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # The harness pin (0.13.364) itself pins core 2026.9.1; the assert
      # proves a harness bump did not silently move the core.
      - name: Install the test harness
        run: pip install -r requirements_test.txt
      - name: Verify runtime versions
        run: |
          python -c "from importlib.metadata import version; import sys; assert version('homeassistant') == '2026.9.1'; assert sys.version_info[:2] == (3, 14)"
      - name: Lint
        run: ruff check custom_components/dashboard_editor tests scripts
      - name: Type check
        run: mypy --python-version 3.14 custom_components/dashboard_editor/
      - name: Run the suite
        run: pytest tests/ -v
      - name: Validate the release version fields
        run: python3 scripts/build_release_artifacts.py --validate-only

  bundle-drift:
    name: Frontend bundle matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/dashboard_editor/frontend/package-lock.json
      # HACS serves the committed dist/ bundle, so any drift from source fails here.
      - name: Rebuild the bundle and fail on drift
        run: |
          cd custom_components/dashboard_editor/frontend
          npm ci
          npm run build
          git diff --exit-code dist/
